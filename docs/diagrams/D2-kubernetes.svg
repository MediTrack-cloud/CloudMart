<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ad" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="apu" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/></marker>
  </defs>
  <rect width="1180" height="780" fill="#ffffff"/>
  <text x="590" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">D2 — CloudMart Kubernetes Architecture (Amazon EKS)</text>

  <rect x="410" y="50" width="330" height="50" rx="8" fill="#ffe9cc" stroke="#f59e0b"/>
  <text x="575" y="80" text-anchor="middle" font-size="15" fill="#1e293b">EKS Control Plane (managed, Multi-AZ)</text>
  <line x1="575" y1="100" x2="575" y2="135" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/>
  <rect x="445" y="135" width="260" height="46" rx="8" fill="#dceefb" stroke="#4a9eed"/>
  <text x="575" y="163" text-anchor="middle" font-size="14" fill="#1e293b">Ingress -&gt; ALB (LB Controller)</text>

  <rect x="40" y="205" width="770" height="450" rx="12" fill="#eef3ff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="58" y="230" font-size="17" font-weight="600" fill="#2563eb">Namespace: cloudmart-prod  (main branch)</text>

  <rect x="70" y="250" width="160" height="70" rx="8" fill="#d7f7dd" stroke="#22c55e"/>
  <text x="150" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">frontend</text>
  <text x="150" y="300" text-anchor="middle" font-size="13" fill="#475569">x2 · Svc:80</text>

  <rect x="260" y="250" width="180" height="70" rx="8" fill="#dceefb" stroke="#4a9eed"/>
  <text x="350" y="277" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">product-service</text>
  <text x="350" y="296" text-anchor="middle" font-size="12" fill="#475569">x2 · Svc:8001 · HPA 2→6</text>

  <rect x="470" y="250" width="160" height="70" rx="8" fill="#dceefb" stroke="#4a9eed"/>
  <text x="550" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">order-service</text>
  <text x="550" y="300" text-anchor="middle" font-size="13" fill="#475569">x2 · Svc:8002</text>

  <rect x="660" y="250" width="130" height="70" rx="8" fill="#dceefb" stroke="#4a9eed"/>
  <text x="725" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">user-service</text>
  <text x="725" y="300" text-anchor="middle" font-size="13" fill="#475569">x2 · Svc:8003</text>

  <line x1="545" y1="181" x2="170" y2="250" stroke="#22c55e" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="230" y1="278" x2="260" y2="278" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/>
  <text x="232" y="270" font-size="11" fill="#475569">ClusterIP</text>
  <line x1="470" y1="300" x2="440" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/>

  <rect x="260" y="338" width="180" height="42" rx="8" fill="#fff3c4" stroke="#f59e0b"/>
  <text x="350" y="364" text-anchor="middle" font-size="13" fill="#1e293b">HPA 60% CPU  2-&gt;6</text>
  <rect x="470" y="338" width="160" height="42" rx="8" fill="#fff3c4" stroke="#f59e0b"/>
  <text x="550" y="364" text-anchor="middle" font-size="13" fill="#1e293b">HPA 60% CPU  2-&gt;6</text>
  <line x1="350" y1="338" x2="350" y2="322" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ao)"/>
  <line x1="550" y1="338" x2="550" y2="322" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ao)"/>

  <rect x="260" y="470" width="190" height="66" rx="8" fill="#dceefb" stroke="#4a9eed"/>
  <text x="355" y="498" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">notification-service</text>
  <text x="355" y="518" text-anchor="middle" font-size="12" fill="#475569">x1 · no inbound HTTP</text>
  <rect x="490" y="475" width="180" height="56" rx="8" fill="#ece3ff" stroke="#8b5cf6"/>
  <text x="580" y="498" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">KEDA scaler</text>
  <text x="580" y="517" text-anchor="middle" font-size="12" fill="#475569">SQS depth · 0-&gt;N</text>
  <line x1="490" y1="503" x2="450" y2="503" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#apu)"/>

  <text x="70" y="585" font-size="13" fill="#475569">PodDisruptionBudget minAvailable=1 on every prod Deployment</text>

  <rect x="40" y="668" width="770" height="74" rx="10" fill="#ece3ff" stroke="#8b5cf6"/>
  <text x="58" y="694" font-size="16" font-weight="600" fill="#7c3aed">Namespace: cloudmart-staging  (develop branch)</text>
  <text x="58" y="720" font-size="13" fill="#475569">Same 5-service topology, 1 replica each (cost-optimised)</text>

  <rect x="850" y="250" width="220" height="56" rx="8" fill="#ffe9cc" stroke="#f59e0b"/>
  <text x="960" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Cluster Autoscaler</text>
  <text x="960" y="293" text-anchor="middle" font-size="12" fill="#475569">nodes 2-&gt;6</text>
  <rect x="850" y="324" width="220" height="50" rx="8" fill="#fff3c4" stroke="#f59e0b"/>
  <text x="960" y="354" text-anchor="middle" font-size="13" fill="#1e293b">Metrics Server (HPA feed)</text>
  <rect x="850" y="392" width="220" height="56" rx="8" fill="#dceefb" stroke="#4a9eed"/>
  <text x="960" y="426" text-anchor="middle" font-size="14" fill="#1e293b">EKS Nodes 2x t3.medium</text>
  <line x1="960" y1="306" x2="960" y2="392" stroke="#f59e0b" stroke-width="2" marker-end="url(#ao)"/>
  <text x="968" y="372" font-size="12" fill="#9a5030">scale</text>
  <line x1="740" y1="75" x2="955" y2="250" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ao)"/>
  <text x="800" y="150" font-size="12" fill="#9a5030">manages</text>
</svg>

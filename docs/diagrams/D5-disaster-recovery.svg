  <line x1="202" y1="292" x2="420" y2="405" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#apu)"/>

  <rect x="895" y="60" width="255" height="410" rx="12" fill="#fffbe6" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="913" y="86" font-size="16" font-weight="600" fill="#9a5030">RTO / RPO Targets</text>
  <rect x="910" y="104" width="225" height="48" rx="8" fill="#fff3c4" stroke="#f59e0b"/>

  <text x="1022" y="195" text-anchor="middle" font-size="13" fill="#1e293b">EKS: RPO 24h / RTO 30m</text>
  <rect x="910" y="228" width="225" height="48" rx="8" fill="#fff3c4" stroke="#f59e0b"/>
  <text x="1022" y="257" text-anchor="middle" font-size="13" fill="#1e293b">DynamoDB: RPO 5m / RTO 5m</text>
  <rect x="910" y="290" width="225" height="48" rx="8" fill="#fff3c4" stroke="#f59e0b"/>
  <text x="1022" y="319" text-anchor="middle" font-size="13" fill="#1e293b">Infra: RTO 60m (Terraform)</text>
  <rect x="910" y="352" width="225" height="48" rx="8" fill="#fff3c4" stroke="#f59e0b"/>
  <text x="1022" y="381" text-anchor="middle" font-size="13" fill="#1e293b">DNS failover: RTO 30s</text>

  <text x="40" y="520" font-size="16" font-weight="600" fill="#2563eb">Estimated Recovery Timeline</text>
  <line x1="60" y1="575" x2="1130" y2="575" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/>
  <circle cx="135" cy="575" r="7" fill="#ef4444"/>
  <text x="135" y="558" text-anchor="middle" font-size="13" fill="#ef4444">30s DNS</text>
  <circle cx="385" cy="575" r="7" fill="#4a9eed"/>
  <text x="385" y="600" text-anchor="middle" font-size="13" fill="#4a9eed">2m RDS</text>
  <circle cx="620" cy="575" r="7" fill="#06b6d4"/>
  <text x="620" y="558" text-anchor="middle" font-size="13" fill="#06b6d4">5m DynamoDB</text>
  <circle cx="850" cy="575" r="7" fill="#8b5cf6"/>
  <text x="850" y="600" text-anchor="middle" font-size="13" fill="#8b5cf6">30m Velero</text>
  <circle cx="1060" cy="575" r="7" fill="#f59e0b"/>
  <text x="1060" y="558" text-anchor="middle" font-size="13" fill="#9a5030">60m rebuild</text>

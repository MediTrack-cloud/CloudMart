  <text x="202" y="135" text-anchor="middle" font-size="13" fill="#1e293b">RDS automated backup 7-day + PITR</text>
  <rect x="50" y="172" width="305" height="52" rx="8" fill="#d6f7ec" stroke="#06b6d4"/>
  <text x="202" y="203" text-anchor="middle" font-size="13" fill="#1e293b">DynamoDB PITR (35-day window)</text>
  <rect x="50" y="240" width="305" height="52" rx="8" fill="#d6f7ec" stroke="#06b6d4"/>
  <text x="202" y="266" text-anchor="middle" font-size="12" fill="#1e293b">Velero daily 02:00 UTC -&gt; S3</text>
  <text x="202" y="283" text-anchor="middle" font-size="12" fill="#475569">(KMS, versioned)</text>
  <rect x="50" y="308" width="305" height="52" rx="8" fill="#d6f7ec" stroke="#06b6d4"/>
  <text x="202" y="339" text-anchor="middle" font-size="13" fill="#1e293b">Terraform state S3 + DynamoDB lock</text>
  <rect x="50" y="376" width="305" height="52" rx="8" fill="#d6f7ec" stroke="#06b6d4"/>
  <text x="202" y="407" text-anchor="middle" font-size="13" fill="#1e293b">K8s manifests versioned in Git</text>

  <rect x="400" y="60" width="470" height="410" rx="12" fill="#fff4e6" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="418" y="86" font-size="17" font-weight="600" fill="#9a5030">Failover &amp; Restore Paths</text>
  <rect x="420" y="104" width="185" height="52" rx="8" fill="#dceefb" stroke="#4a9eed"/>
  <text x="512" y="135" text-anchor="middle" font-size="14" fill="#1e293b">RDS primary (1a)</text>
  <rect x="680" y="104" width="175" height="52" rx="8" fill="#dceefb" stroke="#4a9eed"/>
  <text x="767" y="135" text-anchor="middle" font-size="14" fill="#1e293b">RDS standby (1b)</text>

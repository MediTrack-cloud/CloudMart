<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ad" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/></marker>
    <marker id="apu" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/></marker>
  </defs>
  <rect width="1180" height="660" fill="#ffffff"/>
  <text x="590" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">D5 — CloudMart Disaster Recovery</text>

  <rect x="30" y="60" width="345" height="410" rx="12" fill="#e6fbf3" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="48" y="86" font-size="17" font-weight="600" fill="#0e7490">Backup Strategy</text>

  <rect x="420" y="196" width="185" height="52" rx="8" fill="#ffe9cc" stroke="#f59e0b"/>
  <text x="512" y="227" text-anchor="middle" font-size="13" fill="#1e293b">Route53 health check</text>
  <rect x="680" y="196" width="175" height="52" rx="8" fill="#d7f7dd" stroke="#22c55e"/>
  <text x="767" y="227" text-anchor="middle" font-size="14" fill="#1e293b">ALB /health</text>
  <line x1="605" y1="222" x2="680" y2="222" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/>
  <rect x="540" y="290" width="250" height="52" rx="8" fill="#ffe0e0" stroke="#ef4444"/>

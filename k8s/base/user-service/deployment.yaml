apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: cloudmart-prod
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: user-service
    spec:
      serviceAccountName: user-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: user-service
          image: 898865655202.dkr.ecr.us-east-1.amazonaws.com/cloudmart/user-service:latest
          ports:
            - containerPort: 8003
          env:
            - name: PORT
              value: "8003"
            - name: DB_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: cloudmart-config
                  key: DB_BACKEND
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudmart-user-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudmart-user-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRY_HOURS
              valueFrom:
                configMapKeyRef:
                  name: cloudmart-config
                  key: JWT_EXPIRY_HOURS
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: cloudmart-config
                  key: AWS_REGION
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

# KEDA ScaledObject — scales notification-service on SQS queue depth.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-credentials
  namespace: cloudmart-prod
spec:
  podIdentity:
    provider: aws
    identityOwner: keda
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-service-scaler
  namespace: cloudmart-prod
  labels:
    app: notification-service
spec:
  scaleTargetRef:
    name: notification-service
  minReplicaCount: 0    # scale to zero when queue is empty — saves cost
  maxReplicaCount: 5
  cooldownPeriod: 60
  pollingInterval: 15
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: "https://sqs.__REGION__.amazonaws.com/ACCOUNT_ID/cloudmart-orders-prod"
        queueLength: "5"          # scale up when 5+ messages per replica
        awsRegion: "__REGION__"
        identityOwner: keda
      authenticationRef:
        name: keda-aws-credentials

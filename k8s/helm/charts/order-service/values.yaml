replicaCount: 2
image:
  repository: order-service
  pullPolicy: IfNotPresent
  tag: ""
serviceAccount:
  name: order-service-sa
  annotations: {}
service:
  type: ClusterIP
  port: 8002
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
pdb:
  enabled: true
  minAvailable: 1
env:
  AWS_REGION: us-east-1
configMapRef: cloudmart-config
nodeSelector: {}
tolerations: []
affinity: {}

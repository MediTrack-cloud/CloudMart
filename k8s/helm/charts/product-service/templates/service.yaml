{{- $global := .Values.global | default dict }}
{{- $ns := $global.namespace | default (printf "cloudmart-%s" ($global.environment | default "prod")) }}
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: {{ $ns }}
  labels:
    app: product-service
spec:
  type: {{ .Values.service.type }}
  selector:
    app: product-service
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP

{{- $global := .Values.global | default dict }}
{{- $env := $global.environment | default "prod" }}
{{- $ns  := $global.namespace   | default (printf "cloudmart-%s" $env) }}
{{- $reg := $global.imageRegistry | default (printf "%s.dkr.ecr.%s.amazonaws.com/cloudmart" ($global.awsAccountId | default "") ($global.awsRegion | default "us-east-1")) }}
{{- $tag := $global.imageTag     | default .Chart.AppVersion }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: {{ $ns }}
  labels:
    app: product-service
    app.kubernetes.io/name: product-service
    app.kubernetes.io/version: {{ $tag | quote }}
    environment: {{ $env }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: product-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: product-service
        environment: {{ $env }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: product-service
          image: {{ $reg }}/product-service:{{ $tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapRef }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: product-service

replicaCount: 2

image:
  repository: product-service
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion; overridden by global.imageTag

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  name: product-service-sa
  annotations: {}  # irsa role-arn injected via values-prod/staging

service:
  type: ClusterIP
  port: 8001

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: true
  minAvailable: 1

env:
  STORE_BACKEND: dynamodb
  AWS_REGION: us-east-1
  DYNAMODB_TABLE: ""  # injected from ConfigMap / values

configMapRef: cloudmart-config

nodeSelector: {}
tolerations: []
affinity: {}

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-and-privileged
  annotations:
    policies.kyverno.io/title: Disallow Root and Privileged Containers
    policies.kyverno.io/description: >
      Containers must not run as root or in privileged mode.
      All CloudMart services already use non-root users in their Dockerfiles.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-not-root
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [cloudmart-prod, cloudmart-staging]
      validate:
        message: "Containers must not run as root. Set runAsNonRoot=true at the pod or container securityContext."
        # Accept runAsNonRoot set at EITHER the pod level (what all CloudMart
        # workloads do — spec.securityContext.runAsNonRoot) OR per container.
        # A single `pattern` requiring it per-container wrongly blocks the valid
        # pod-level form, so anyPattern allows both.
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true

    - name: check-not-privileged
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [cloudmart-prod, cloudmart-staging]
      validate:
        message: "Privileged containers are not allowed."
        pattern:
          spec:
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"

    - name: require-no-privilege-escalation
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [cloudmart-prod, cloudmart-staging]
      validate:
        message: "allowPrivilegeEscalation must be set to false."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false

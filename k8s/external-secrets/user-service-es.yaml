apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudmart-user-secrets
  namespace: cloudmart-prod
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: cloudmart-user-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: cloudmart/rds/user-service/staging
        property: DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: cloudmart/user-service/staging
        property: JWT_SECRET

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudmart-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/madhurajayashanka/CloudMart-demo
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudmart-prod
  syncPolicy:
    # Manual sync for prod — CD pipeline calls `argocd app sync` after approval gate
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  # Rollback: argocd app rollback cloudmart-prod <revision>


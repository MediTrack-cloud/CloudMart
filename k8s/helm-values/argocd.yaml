# ArgoCD Helm values
# Install: helm install argocd argo/argo-cd \
#            -n argocd --create-namespace -f k8s/helm-values/argocd.yaml

global:
  image:
    tag: v2.10.0

server:
  replicas: 1    # 2 for prod HA
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP  # Expose via ALB Ingress or kubectl port-forward

  ingress:
    enabled: false  # Enable and configure with ALB if needed

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

dex:
  enabled: false  # Enable for SSO integration

configs:
  params:
    # Allow managing resources in any namespace (required for multi-namespace deploy)
    application.namespaces: "cloudmart-prod,cloudmart-staging"

# Metrics Server Helm values (required for HPA)
# Install: helm install metrics-server metrics-server/metrics-server \
#            -n kube-system -f k8s/helm-values/metrics-server.yaml

args:
  - --kubelet-insecure-tls   # Required for EKS

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    cpu: 500m
    memory: 500Mi
